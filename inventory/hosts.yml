---
# ホスト、グループ、接続先の ansible_host だけを書く。その他の変数は group_vars と host_vars に置く。
# localhost-mac.yml は暗黙の localhost で動くため、このインベントリは不要。
k3s:
  children:
    k3s_server:
      hosts:
        mac-mini-2018:
          ansible_host: 192.168.11.200
    k3s_agent:
      hosts:
        # M4 上の Lima の VM（tasks/vm_host/lima.yml）。ブリッジ側の固定 IP で接続する。
        # host_vars/mac-mini-m4.yml の vm_host_vm_ip と一緒に変える。
        k3s-agent-vm:
          ansible_host: 192.168.11.201
# k3s の VM を動かす macOS。k3s のノードではないので k3s グループに入れない。
vm_hosts:
  hosts:
    mac-mini-m4:
      # ~/.ssh/config の Host 名（HostName は mDNS の名前）。IP は固定しない。
      ansible_host: k3s-mac-mini-m4
