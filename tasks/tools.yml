---
# その他のツール関連のタスク（Apple Silicon 専用）

# Krew 本体は Homebrew で入れる。導入済みのプラグインは更新しない（更新は `kubectl krew upgrade`）。
- name: Install Krew plugins
  ansible.builtin.command: "kubectl krew install {{ item }}"
  args:
    creates: "{{ xdg_data_home }}/krew/receipts/{{ item }}.yaml"
  environment:
    # export KREW_ROOT="$XDG_DATA_HOME/krew"
    # export PATH="${KREW_ROOT:-$XDG_DATA_HOME/krew}/bin:$PATH"
    KREW_ROOT: "{{ xdg_data_home }}/krew"
    PATH: "{{ xdg_data_home }}/krew/bin:{{ lookup('env', 'PATH') }}"
  loop:
    - stern
    - ctx
    - ns
    - rolesum
    - access-matrix
    - cost

- name: Install SOPS binary
  vars:
    sops_version: "v3.10.1"
    sops_sha256: e197a40869ece97400c2ca08f195c04d39945158558b2d4203791b24022fc467
  block:
    - name: Create bin directory if it doesn't exist
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download SOPS binary
      ansible.builtin.get_url:
        url: "https://github.com/getsops/sops/releases/download/{{ sops_version }}/sops-{{ sops_version }}.darwin.arm64"
        dest: "{{ lookup('env', 'HOME') }}/.local/bin/sops"
        checksum: "sha256:{{ sops_sha256 }}"
        mode: '0755'
      # 初回の --check では ~/.local/bin がまだ存在しない。
      ignore_errors: "{{ ansible_check_mode }}"

# NOTE: 公式の `curl https://hishtory.dev/install.py | python3 -` は
# install.py 内部で api.hishtory.dev から配布 URL を取得するため、
# 同バックエンドの障害（例: 502 Bad Gateway）でインストールが失敗する。
# それを避けるため、SOPS と同じく GitHub Releases から直接バイナリを取得し、
# バイナリ自身の `install --offline` でセルフインストールする。
# 導入済みの Mac では、hishtory_version を上げても更新されない（更新は `hishtory update`）。
- name: Install and configure hishtory
  vars:
    hishtory_version: "v0.335"
    hishtory_sha256: 01850a83522c38d27643503530287bf86281044109487e219051789165e43d14
    hishtory_settings:
      filter-duplicate-commands: 'true'
      timestamp-format: '2006/1/2 15:04'
      full-screen: 'true'
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.hishtory:{{ lookup('env', 'PATH') }}"
  block:
    - name: Check if hishtory is already installed
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.hishtory/config.zsh"
      register: hishtory_config

    - name: Download hishtory binary
      ansible.builtin.get_url:
        url: "https://github.com/ddworken/hishtory/releases/download/{{ hishtory_version }}/hishtory-darwin-arm64"
        dest: "/tmp/hishtory-client-{{ hishtory_version }}"
        checksum: "sha256:{{ hishtory_sha256 }}"
        mode: '0755'
      when: not hishtory_config.stat.exists

    - name: Install hishtory (offline, self-install)
      ansible.builtin.command: "/tmp/hishtory-client-{{ hishtory_version }} install --offline"
      args:
        creates: "{{ lookup('env', 'HOME') }}/.hishtory/config.zsh"
      when: not hishtory_config.stat.exists

    - name: Remove temporary hishtory binary
      ansible.builtin.file:
        path: "/tmp/hishtory-client-{{ hishtory_version }}"
        state: absent
      when: not hishtory_config.stat.exists

    # `install --offline` の時点で syncing は無効化済みのため
    # `hishtory syncing disable`（実行するとエラーになる）は不要。
    - name: Read hishtory settings
      ansible.builtin.command:
        argv: [hishtory, config-get, "{{ item.key }}"]
      loop: "{{ hishtory_settings | dict2items }}"
      register: hishtory_current
      changed_when: false
      check_mode: false
      # 初回の --check では hishtory がまだ存在しない。
      when: hishtory_config.stat.exists or not ansible_check_mode

    - name: Configure hishtory settings
      ansible.builtin.command:
        argv: [hishtory, config-set, "{{ item.item.key }}", "{{ item.item.value }}"]
      loop: "{{ hishtory_current.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      changed_when: true
      when:
        - item is not skipped
        - item.stdout != item.item.value

- name: Install git-worktree-runner (gtr)
  block:
    - name: Clone git-worktree-runner repository
      ansible.builtin.git:
        repo: https://github.com/coderabbitai/git-worktree-runner.git
        dest: "{{ xdg_data_home }}/git-worktree-runner"
        version: 18c0b1b8ce3ff75726d7832bc8e59b6d21543596 # v3.1.0
        update: true

    - name: Create symlink for git-gtr
      ansible.builtin.file:
        src: "{{ xdg_data_home }}/git-worktree-runner/bin/git-gtr"
        dest: "{{ lookup('env', 'HOME') }}/.local/bin/git-gtr"
        state: link
      # 初回の --check では clone されず、リンク元がない。
      ignore_errors: "{{ ansible_check_mode }}"

# Alacritty は子プロセスへ渡す TERM を決める際、terminfo データベースに `alacritty`
# エントリが引けるかを確認し、無ければ `xterm-256color` にフォールバックする。
# macOS 標準の ncurses (/usr/share/terminfo) は alacritty エントリを持たず、
# Homebrew も terminfo を配置しないため、放置すると TERM=xterm-256color のままになり
# undercurl (Smulx) と synchronized output (Sync) が使えない。
# コンパイル済みエントリは app バンドルに同梱されているものの ncurses の検索パス外なので、
# ncurses が必ず探索する ~/.terminfo/ へコピーする。
- name: Install Alacritty terminfo
  vars:
    # ncurses は端末名の頭文字ごとのサブディレクトリにエントリを格納する。macOS は
    # 大文字小文字を区別しない FS が既定で 'A' と 'a' のディレクトリを共存させられないため、
    # 文字そのものではなく hex を使う（`61` = 'a'）。`alacritty` が 'a' 始まりである限り
    # この値は変わらないが、命名規則やバンドル構造の変更に追従できるよう、
    # コピー先のディレクトリ名はコピー元から導出してリテラルを 1 箇所に閉じ込める。
    alacritty_app_path: /Applications/Alacritty.app
    alacritty_terminfo_src: "{{ alacritty_app_path }}/Contents/Resources/61"
    user_terminfo_dir: "{{ lookup('env', 'HOME') }}/.terminfo"
  block:
    - name: Check if Alacritty.app is installed
      ansible.builtin.stat:
        path: "{{ alacritty_app_path }}"
      register: alacritty_app

    - name: Check if Alacritty.app ships compiled terminfo entries
      ansible.builtin.stat:
        path: "{{ alacritty_terminfo_src }}"
      register: alacritty_terminfo_bundled

    # Alacritty.app があるのに terminfo が見つからないのはバンドル構造が変わった可能性が高い。
    # 黙って飛ばすと TERM が xterm-256color に戻ったことに気付けないため警告する。
    - name: Warn if the bundled terminfo path has moved
      ansible.builtin.debug:
        msg: >-
          Alacritty.app is installed but {{ alacritty_terminfo_src }} was not found.
          The app bundle layout may have changed; update alacritty_terminfo_src.
      when: alacritty_app.stat.exists and not alacritty_terminfo_bundled.stat.exists

    # `mode` は指定しない。指定するとコピー先ディレクトリにも適用されて 0644
    # （実行ビットなし＝辿れない）になり、terminfo が引けないうえ毎回 changed になる。
    # ファイルはコピー元の 0644 のまま複製される。
    - name: Copy Alacritty terminfo entries into the user terminfo database # noqa: risky-file-permissions
      ansible.builtin.copy:
        src: "{{ alacritty_terminfo_src }}/"
        dest: "{{ user_terminfo_dir }}/{{ alacritty_terminfo_src | basename }}/"
        directory_mode: '0755'
        remote_src: true
      when: alacritty_terminfo_bundled.stat.exists
