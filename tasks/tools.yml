---
# その他のツール関連のタスク

- name: Install Krew
  environment:
    # export KREW_ROOT="$XDG_DATA_HOME/krew"
    KREW_ROOT: "{{ xdg_data_home }}/krew"
  script: "{{ playbook_dir }}/scripts/install_krew.sh"

- name: Install Krew plugins
  shell: "kubectl krew install {{ item }}"
  environment:
    # export PATH="${KREW_ROOT:-$XDG_DATA_HOME/krew}/bin:$PATH"
    PATH: "{{ xdg_data_home }}/krew/bin:{{ lookup('env', 'PATH') }}"
  with_items:
    - stern
    - ctx
    - ns
    - rolesum
    - access-matrix
    - cost

- name: Install SOPS binary
  block:
    - name: Get OS and architecture
      shell: |
        OS="$(uname | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/')"
        echo "${OS},${ARCH}"
      register: os_arch
      changed_when: false
      check_mode: no

    - name: Set OS and architecture variables
      set_fact:
        sops_os: "{{ os_arch.stdout.split(',')[0] }}"
        sops_arch: "{{ os_arch.stdout.split(',')[1] }}"

    - name: Set SOPS version
      set_fact:
        sops_version: "v3.10.1"

    - name: Download SOPS binary
      get_url:
        url: "https://github.com/getsops/sops/releases/download/{{ sops_version }}/sops-{{ sops_version }}.{{ sops_os }}.{{ sops_arch }}"
        dest: "/tmp/sops-{{ sops_version }}.{{ sops_os }}.{{ sops_arch }}"
        mode: '0755'

    - name: Create bin directory if it doesn't exist
      file:
        path: "{{ lookup('env', 'HOME') }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Move SOPS binary to PATH
      copy:
        src: "/tmp/sops-{{ sops_version }}.{{ sops_os }}.{{ sops_arch }}"
        dest: "{{ lookup('env', 'HOME') }}/.local/bin/sops"
        mode: '0755'
        remote_src: yes

# NOTE: 公式の `curl https://hishtory.dev/install.py | python3 -` は
# install.py 内部で api.hishtory.dev から配布 URL を取得するため、
# 同バックエンドの障害（例: 502 Bad Gateway）でインストールが失敗する。
# それを避けるため、SOPS と同じく GitHub Releases から直接バイナリを取得し、
# バイナリ自身の `install --offline` でセルフインストールする。
- name: Install and configure hishtory
  block:
    - name: Check if hishtory is already installed
      stat:
        path: "{{ lookup('env', 'HOME') }}/.hishtory/config.zsh"
      register: hishtory_config

    - name: Get OS and architecture for hishtory
      shell: |
        OS="$(uname | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64$/arm64/' -e 's/armv7l$/arm/')"
        echo "${OS},${ARCH}"
      register: hishtory_os_arch
      changed_when: false
      check_mode: no
      when: not hishtory_config.stat.exists

    - name: Set hishtory OS, architecture and version variables
      set_fact:
        hishtory_os: "{{ hishtory_os_arch.stdout.split(',')[0] }}"
        hishtory_arch: "{{ hishtory_os_arch.stdout.split(',')[1] }}"
        hishtory_version: "v0.335"
      when: not hishtory_config.stat.exists

    - name: Download hishtory binary
      get_url:
        url: "https://github.com/ddworken/hishtory/releases/download/{{ hishtory_version }}/hishtory-{{ hishtory_os }}-{{ hishtory_arch }}"
        dest: "/tmp/hishtory-client-{{ hishtory_version }}"
        mode: '0755'
      when: not hishtory_config.stat.exists

    - name: Install hishtory (offline, self-install)
      shell: "/tmp/hishtory-client-{{ hishtory_version }} install --offline"
      args:
        creates: "{{ lookup('env', 'HOME') }}/.hishtory/config.zsh"
      when: not hishtory_config.stat.exists

    - name: Remove temporary hishtory binary
      file:
        path: "/tmp/hishtory-client-{{ hishtory_version }}"
        state: absent
      when: not hishtory_config.stat.exists

    # `install --offline` の時点で syncing は無効化済みのため
    # `hishtory syncing disable`（実行するとエラーになる）は不要。
    - name: Configure hishtory settings
      shell: |
        hishtory config-set filter-duplicate-commands true
        hishtory config-set timestamp-format '2006/1/2 15:04'
        hishtory config-set full-screen true
      environment:
        PATH: "{{ lookup('env', 'HOME') }}/.hishtory:{{ lookup('env', 'PATH') }}"

- name: Install git-worktree-runner (gtr)
  block:
    - name: Clone git-worktree-runner repository
      git:
        repo: https://github.com/coderabbitai/git-worktree-runner.git
        dest: "{{ xdg_data_home }}/git-worktree-runner"
        version: main
        update: yes

    - name: Create symlink for git-gtr
      file:
        src: "{{ xdg_data_home }}/git-worktree-runner/bin/git-gtr"
        dest: "{{ lookup('env', 'HOME') }}/.local/bin/git-gtr"
        state: link
