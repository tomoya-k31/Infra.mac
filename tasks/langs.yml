---
# 言語インストール関連のタスク

# インストーラは冪等ではなく、rustup 導入済みでも毎回 rustup-init を取得し直し、
# stable チャンネルが動いていればツールチェーンを丸ごと再展開する。
# 既定 profile の rust-docs は 6.5 万ファイル超あり、macOS では 1 ファイルごとの
# xattr 付与と Gatekeeper スキャンが入るため展開だけで 10 分以上かかる。
# 導入済みなら丸ごとスキップし、更新は `rustup update` を手動で叩く運用にする。
- name: Install Rust by rustup
  block:
    - name: Check if rustup is already installed
      ansible.builtin.stat:
        path: "{{ xdg_data_home }}/cargo/bin/rustup"
      register: rustup_bin

    - name: Install Rust by rustup # noqa: command-instead-of-module
      environment:
        # export RUSTUP_HOME="$XDG_DATA_HOME/rustup"
        # export CARGO_HOME="$XDG_DATA_HOME/cargo"
        RUSTUP_HOME: "{{ xdg_data_home }}/rustup"
        CARGO_HOME: "{{ xdg_data_home }}/cargo"
      ansible.builtin.shell: |
        set -o pipefail
        curl https://sh.rustup.rs -sSf | sh -s -- -y --no-modify-path
      args:
        executable: /bin/bash
      changed_when: true
      when: not rustup_bin.stat.exists

# 導入済みだとインストーラーが途中で終了し、curl が書き込みに失敗しうるため、pipefail は使わない。
- name: Install SDKMAN # noqa: command-instead-of-module risky-shell-pipe
  environment:
    # export SDKMAN_DIR="$XDG_DATA_HOME/sdkman"
    SDKMAN_DIR: "{{ xdg_data_home }}/sdkman"
  # SDKMAN requires Bash 4+; macOS default is 3.2 so use Homebrew bash explicitly.
  ansible.builtin.shell: curl -s "https://get.sdkman.io" | /opt/homebrew/bin/bash -s -- -y
  changed_when: true

- name: Install pipx
  ansible.builtin.command: pip install --user pipx
  changed_when: true
  when: pip_path is file
  tags: [langs, pip, python]
  vars:
    pip_path: "{{ xdg_data_home }}/mise/shims/pip"
