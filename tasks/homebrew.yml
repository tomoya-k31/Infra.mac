---
# Homebrew関連のタスク（一覧は vars/mac/）

- name: Install homebrew packages
  community.general.homebrew:
    name: '{{ item }}'
    state: present
  loop: "{{ mac_brew_formulae + (mac_profile_brew_formulae | default([], true)) }}"

- name: Install homebrew cask applications
  community.general.homebrew_cask:
    name: "{{ mac_brew_casks + (mac_profile_brew_casks | default([], true)) }}"
    state: present
