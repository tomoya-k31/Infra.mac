---
# k3s サーバー本体のタスク

# IP が DHCP で変わると証明書や kubeconfig の宛先と食い違うため、先に止める。
- name: Verify the node uses the expected IP address
  ansible.builtin.assert:
    that: ansible_facts['default_ipv4']['address'] == ansible_host
    fail_msg: "Default IPv4 is {{ ansible_facts['default_ipv4']['address'] }}, expected {{ ansible_host }}"

- name: Check ufw status
  become: true
  ansible.builtin.command: ufw status
  register: ufw_status
  changed_when: false
  # rc=2 は ufw が未導入の場合。
  failed_when: ufw_status.rc not in [0, 2]
  check_mode: false

- name: Verify ufw is inactive
  ansible.builtin.assert:
    that: "'Status: active' not in (ufw_status.stdout | default(''))"
    fail_msg: "ufw is active. Firewall rules are not managed here; disable ufw (see https://docs.k3s.io/installation/requirements)."

# バイナリの版や設定ファイルではなく、稼働中の kubelet の版、flannel の種類、起動時の引数を見る。インストーラーはサービスの再作成より先に
# バイナリを置き換えるため、途中で失敗したときに導入済みと誤認しないようにする。
- name: Check the running k3s version and settings
  become: true
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - node
      - "{{ ansible_facts['nodename'] | lower }}"
      - -o
      - 'jsonpath={.status.nodeInfo.kubeletVersion} {.metadata.annotations.flannel\.alpha\.coreos\.com/backend-type} {.metadata.annotations.k3s\.io/node-args}'
  register: k3s_running
  # rc=2 は k3s が未導入（コマンドがない）、NotFound はノードが未登録の場合。起動直後など API の一時的な不調では、すぐに再インストールしない。
  until: k3s_running.rc in [0, 2] or 'NotFound' in (k3s_running.stderr | default(''))
  retries: 12
  delay: 5
  changed_when: false
  failed_when: false
  # 再試行を使い切ると失敗になるため、次の確認で理由を示して止める。
  ignore_errors: true
  check_mode: false

# API が止まり続けているときに入れ直すと、唯一の control plane を再起動してしまう。起動に失敗し続ける場合も自動では直さず、原因を手で直す。
- name: Stop when the k3s API stays unreachable
  ansible.builtin.assert:
    that: k3s_running.rc in [0, 2] or 'NotFound' in (k3s_running.stderr | default(''))
    fail_msg: >-
      k3s is installed, but its API did not answer for about 60 seconds, so it is neither reinstalled nor restarted.
      Check 'systemctl status k3s' and 'journalctl -u k3s' on the server, fix the cause, and run again.
      kubectl said: {{ k3s_running.stderr | default(k3s_running.msg | default(''), true) }}

- name: Create the k3s config directory
  become: true
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

# agent の参加に使う token。指定しないと、管理者相当の server token が agent token を兼ねる。
# config.yaml は一般ユーザーも読めるため、値は root だけが読めるファイルに置き、agent-token-file で指す。
- name: Read the agent token from 1Password
  ansible.builtin.set_fact:
    k3s_agent_token_value: "{{ lookup('ansible.builtin.pipe', 'op read ' ~ k3s_agent_token_ref) }}"
  no_log: true

# 空のファイルだと k3s が server token を agent token として使いかねないため、短い値は受け付けない。
- name: Verify the agent token is not empty
  ansible.builtin.assert:
    that: k3s_agent_token_value | length >= 32
    fail_msg: "The agent token from {{ k3s_agent_token_ref }} is shorter than 32 characters"
  no_log: true

- name: Write the agent token
  become: true
  ansible.builtin.copy:
    content: "{{ k3s_agent_token_value }}"
    dest: /etc/rancher/k3s/agent-token
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false

# 書いた後、再起動の前に失敗しても次の実行で読み直させるよう、読み込ませた token のハッシュを残す。
- name: Read the checksum of the agent token
  become: true
  ansible.builtin.stat:
    path: /etc/rancher/k3s/agent-token
    checksum_algorithm: sha256
  register: k3s_agent_token_stat

- name: Read the checksum of the loaded agent token
  become: true
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/.agent-token-applied
  register: k3s_agent_token_applied
  # 初回はまだない。
  failed_when: false

# 既定の vxlan は認証のない 8472/udp を LAN に公開するため、host-gw を使う。
# 通信は暗号化されない。LAN を信頼できない場合は wireguard-native にする。
# node-ip を固定しないと、IPv6 アドレスが付いたり変わったりするたびに kube-proxy と k3s が終了する。
# 一般ユーザーの k3s コマンドも読むため 0644 にする。秘密の値はここに書かない。
# 再起動の要否は稼働中の値との差で決めるため、設定を足すときは上の確認と Install k3s の条件も足す。
- name: Configure k3s
  become: true
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: '0644'
    content: |
      flannel-backend: {{ k3s_flannel_backend }}
      node-ip: {{ ansible_host }}
      agent-token-file: /etc/rancher/k3s/agent-token

# get.k3s.io は常に最新のスクリプトを返すため、タグとハッシュで固定する。
# バイナリのハッシュはスクリプト側で検証される。
- name: Download the k3s installer
  become: true
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
    dest: /usr/local/src/k3s-install.sh
    checksum: "sha256:{{ k3s_installer_sha256 }}"
    mode: '0755'

# 再起動の前の Ready を、再起動の後のものと取り違えないよう、プロセスが入れ替わったかで確かめる。
- name: Read the k3s process ID
  become: true
  ansible.builtin.systemd_service:
    name: k3s
  register: k3s_pid_before
  failed_when: false
  check_mode: false

- name: Install k3s
  become: true
  ansible.builtin.command: /usr/local/src/k3s-install.sh
  register: k3s_install
  changed_when: true
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    # 設定だけを変えたときも再起動させる。
    INSTALL_K3S_FORCE_RESTART: 'true'
  # agent token を読み込ませていない（変えた、または前回の再起動の前に失敗した）ときも再起動する。
  when: >-
    not (k3s_running.stdout | default('')).startswith(k3s_version ~ ' ' ~ k3s_flannel_backend ~ ' ')
    or '"--node-ip","' ~ ansible_host ~ '"' not in k3s_running.stdout
    or '"--agent-token-file","/etc/rancher/k3s/agent-token"' not in k3s_running.stdout
    or (k3s_agent_token_applied.content | default('') | b64decode | trim) != k3s_agent_token_stat.stat.checksum | default('')

- name: Wait for k3s to restart
  become: true
  ansible.builtin.systemd_service:
    name: k3s
  register: k3s_pid_after
  until: k3s_pid_after.status.MainPID | default('0') not in ['0', k3s_pid_before.status.MainPID | default('0')]
  retries: 24
  delay: 5
  # インストールのタスクは、実行されれば必ず再起動する。
  when: k3s_install is not skipped

# 再起動直後は以前の Ready が残るため、kubelet の版と設定も合わせて確認する。
# 固定前の IPv6 が残っている間は k3s がもう一度終了しうるため、IP が固定値だけになるのも待つ。
- name: Wait for the node to be Ready
  become: true
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - node
      - "{{ ansible_facts['nodename'] | lower }}"
      - -o
      - 'jsonpath={.status.nodeInfo.kubeletVersion} {.metadata.annotations.flannel\.alpha\.coreos\.com/backend-type} {.status.conditions[?(@.type=="Ready")].status} {.status.addresses[?(@.type=="InternalIP")].address} {.metadata.annotations.k3s\.io/node-args}'
  register: k3s_ready
  until: >-
    k3s_ready.rc == 0
    and k3s_ready.stdout.startswith(k3s_version ~ ' ' ~ k3s_flannel_backend ~ ' True ' ~ ansible_host ~ ' [')
    and '"--node-ip","' ~ ansible_host ~ '"' in k3s_ready.stdout
    and '"--agent-token-file","/etc/rancher/k3s/agent-token"' in k3s_ready.stdout
  retries: 36
  delay: 5
  changed_when: false
  when: not ansible_check_mode

- name: Record the checksum of the loaded agent token
  become: true
  ansible.builtin.copy:
    content: "{{ k3s_agent_token_stat.stat.checksum }}\n"
    dest: /etc/rancher/k3s/.agent-token-applied
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
