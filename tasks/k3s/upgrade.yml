---
# 再起動は行わない。server はクラスタに 1 台だけで、再起動すると API が止まるため、手動で 1 台ずつ行う。

- name: Upgrade apt packages
  become: true
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Warn if a reboot is required
  ansible.builtin.debug:
    msg: "Reboot required: ansible {{ inventory_hostname }} -i inventory -b --become-password-file scripts/become-password.sh -m reboot"
  when: reboot_required.stat.exists
