---
# kubeconfig はクラスタの管理者権限を持つため、--diff やログに出さない。
# サーバー側ではログインユーザーに置かず、sudo k3s kubectl を使う。
# k3s が証明書を更新してもコピーは更新されない。認証エラーになったら再実行する。
# server が複数でも宛先が実行ごとに変わらないよう、inventory の先頭の server からだけ書く。
# --limit で先頭の server を外した実行では更新されない。

- name: Read kubeconfig from the server
  become: true
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig
  no_log: true
  # 初回の --check では k3s.yaml がまだ存在しない。
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname == groups['k3s_server'][0]

- name: Create ~/.kube on the local Mac
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: '0700'
  delegate_to: localhost
  when: inventory_hostname == groups['k3s_server'][0]

- name: Write ~/.kube/config-home on the local Mac
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig.content | b64decode | replace('127.0.0.1', ansible_host) }}"
    dest: "{{ lookup('env', 'HOME') }}/.kube/config-home"
    mode: '0600'
  delegate_to: localhost
  diff: false
  no_log: true
  when:
    - inventory_hostname == groups['k3s_server'][0]
    - k3s_kubeconfig.content is defined
