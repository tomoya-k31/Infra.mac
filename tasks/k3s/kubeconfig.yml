---
# kubeconfig はクラスタの管理者権限を持つため、--diff やログに出さない。
# k3s が証明書を更新してもコピーは更新されない。認証エラーになったら再実行する。

- name: Create ~/.kube on the server
  file:
    path: "{{ ansible_facts['user_dir'] }}/.kube"
    state: directory
    mode: '0700'

- name: Copy kubeconfig for the login user
  become: true
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ ansible_facts['user_dir'] }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: '0600'
  diff: false
  # 初回の --check では k3s.yaml がまだ存在しない。
  ignore_errors: "{{ ansible_check_mode }}"

# 先頭に入れる。末尾の k9s 自動起動ループより後ろだと tty1 で評価されない。
- name: Set KUBECONFIG in ~/.profile
  lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.profile"
    line: export KUBECONFIG=$HOME/.kube/config
    insertbefore: BOF
    create: true
    mode: '0644'

- name: Read kubeconfig from the server
  become: true
  slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig
  no_log: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create ~/.kube on the local Mac
  file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: '0700'
  delegate_to: localhost

- name: Write ~/.kube/config-home on the local Mac
  copy:
    content: "{{ k3s_kubeconfig.content | b64decode | replace('127.0.0.1', ansible_host) }}"
    dest: "{{ lookup('env', 'HOME') }}/.kube/config-home"
    mode: '0600'
  delegate_to: localhost
  diff: false
  no_log: true
  when: k3s_kubeconfig.content is defined
