---
# k3s_mdns_names の名前（Ingress のホスト名）を、このホストの LAN の IPv4 アドレスとして mDNS で広告する。
# ルーターに DNS のレコードを置けないため。.local は mDNS に対応した端末（macOS、iOS など）でしか引けない。
# /etc/avahi/hosts は逆引きも登録するため、このホスト自身の名前と同じ IP では衝突する。
# 名前ごとに avahi-publish -R（逆引きなし）を常駐させる。一覧から外した名前は止める（avahi は残す）。

- name: Check the mDNS names
  ansible.builtin.assert:
    that: k3s_mdns_names | default([]) | reject('match', '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+local\Z') | list | length == 0
    fail_msg: "k3s_mdns_names must be lowercase DNS names ending in .local (labels start and end with a letter or digit)"
    quiet: true

- name: Install avahi
  become: true
  ansible.builtin.apt:
    name: [avahi-daemon, avahi-utils]
    state: present
    update_cache: true
    cache_valid_time: 3600
    # libnss-mdns などは入れない（このホストの名前解決は変えない）。
    install_recommends: false

# 既定ではすべてのインターフェースで広告し、k3s の cni0 などのアドレスも出してしまう。
- name: Limit avahi to the LAN interface
  become: true
  community.general.ini_file:
    path: /etc/avahi/avahi-daemon.conf
    section: server
    option: allow-interfaces
    value: "{{ ansible_facts['default_ipv4']['interface'] }}"
    # avahi は = の前後の空白を許さない。
    no_extra_spaces: true
    mode: '0644'
  notify: Restart avahi

# 初回の適用で書いた名前を消す（逆引きが衝突して広告されない）。
- name: Clear the avahi hosts file
  become: true
  ansible.builtin.copy:
    dest: /etc/avahi/hosts
    mode: '0644'
    content: |
      # 使わない。名前は avahi-alias@<名前>.service が広告する（Ansible の k3s_mdns_names）。
  notify: Restart avahi

- name: Install the mDNS alias service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/avahi-alias@.service
    mode: '0644'
    content: |
      [Unit]
      Description=Publish %i over mDNS
      After=avahi-daemon.service
      BindsTo=avahi-daemon.service

      [Service]
      ExecStart=/usr/bin/avahi-publish --address --no-reverse %i {{ ansible_facts['default_ipv4']['address'] }}
      # DynamicUser では avahi の D-Bus に接続できない（Failed to create client object）。
      User=nobody
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      # 名前が衝突すると avahi-publish は 0 で終わるため、always で再試行する。
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=avahi-daemon.service
  register: mdns_unit
  # avahi を再起動すると、BindsTo の各名前も新しい定義で起動し直す。
  notify: [Reload systemd, Restart avahi]

# 導入直後の avahi は全インターフェースで広告しているので、play の終わりを待たずに設定を反映する。
- name: Apply the avahi settings now
  ansible.builtin.meta: flush_handlers

- name: Enable avahi
  become: true
  ansible.builtin.systemd_service:
    name: avahi-daemon
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Find the published mDNS names
  ansible.builtin.find:
    paths: /etc/systemd/system/avahi-daemon.service.wants
    patterns: "avahi-alias@*.service"
    file_type: link
  register: mdns_enabled

- name: Stop the mDNS names removed from the list
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ mdns_enabled.files | map(attribute='path') | map('basename') | difference(k3s_mdns_names | default([]) | map('regex_replace', '^', 'avahi-alias@') | map('regex_replace', '$', '.service')) }}"

- name: Publish the mDNS names
  become: true
  ansible.builtin.systemd_service:
    name: "avahi-alias@{{ item }}.service"
    enabled: true
    state: started
  loop: "{{ k3s_mdns_names | default([]) }}"
  # 初回の --check ではユニットがまだない。
  when: not (ansible_check_mode and mdns_unit is changed)
