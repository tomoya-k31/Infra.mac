---
# 本体の画面 (tty1) に k9s を常時表示する。
# 自動ログインは使わず、シェルを持たない kiosk ユーザーの systemd サービスとして動かす。
# 身元は k3s のクライアント CA で発行した証明書（CN=kiosk、毎日更新を確認）。権限は Infra.k8s の
# ClusterRoleBinding（User kiosk、閲覧専用で Secret は読めない）が与える。

- name: Download k9s
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_linux_amd64.deb"
    dest: "/usr/local/src/k9s_{{ k9s_version }}_amd64.deb"
    checksum: "sha256:{{ k9s_deb_sha256 }}"
    mode: '0644'

- name: Install k9s
  become: true
  ansible.builtin.apt:
    deb: "/usr/local/src/k9s_{{ k9s_version }}_amd64.deb"
  notify: Restart k9s kiosk
  # 初回の --check では deb がまだ存在しない。
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create the kiosk user
  become: true
  ansible.builtin.user:
    name: kiosk
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/k9s-kiosk
    password: '!'

# 旧方式（ServiceAccount と token）のマニフェスト。消しても既存のオブジェクトは残るので、
# kiosk 名前空間と ClusterRoleBinding は Infra.k8s の RBAC を入れる前に手で消す。
- name: Remove the old kiosk manifest
  become: true
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests/kiosk.yaml
    state: absent

- name: Create the kiosk config directory
  become: true
  ansible.builtin.file:
    path: /etc/k9s-kiosk
    state: directory
    owner: root
    group: kiosk
    mode: '0750'
  # 初回の --check では kiosk グループがまだ存在しない。
  ignore_errors: "{{ ansible_check_mode }}"

# 鍵はこのホストで作り、外に出さない。証明書は k3s のクライアント CA で署名する。
- name: Install the kiosk certificate script
  become: true
  ansible.builtin.copy:
    dest: /usr/local/sbin/k9s-kiosk-cert
    mode: '0755'
    content: |
      #!/bin/sh
      # kiosk のクライアント証明書（CN=kiosk、1 年）を、なければ作る。残り 30 日を切ったとき、
      # CA で検証できないとき（復元や rotate-ca の後）、鍵と合わないときは発行し直す。
      set -eu
      d=/etc/k9s-kiosk
      tls=/var/lib/rancher/k3s/server/tls
      changed=
      umask 077
      # タイマーと Ansible からの実行が重ならないようにする。
      exec 9>/run/k9s-kiosk-cert.lock
      flock 9
      ext=$(mktemp)
      trap 'rm -f "$ext" "$d/client.key.new" "$d/client.crt.new"' EXIT
      if [ ! -s "$d/client.key" ]; then
        openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$d/client.key.new"
        chgrp kiosk "$d/client.key.new"; chmod 0640 "$d/client.key.new"
        mv "$d/client.key.new" "$d/client.key"
      fi
      if ! cmp -s "$tls/server-ca.crt" "$d/ca.crt"; then
        install -o root -g kiosk -m 0640 "$tls/server-ca.crt" "$d/ca.crt"
        changed=1
      fi
      if [ ! -s "$d/client.crt" ] ||
        ! openssl x509 -in "$d/client.crt" -noout -checkend 2592000 >/dev/null ||
        ! openssl verify -partial_chain -CAfile "$tls/client-ca.crt" "$d/client.crt" >/dev/null 2>&1 ||
        [ "$(openssl x509 -in "$d/client.crt" -noout -pubkey)" != "$(openssl pkey -in "$d/client.key" -pubout)" ]; then
        printf 'keyUsage=critical,digitalSignature\nextendedKeyUsage=clientAuth\n' >"$ext"
        openssl req -new -key "$d/client.key" -subj /CN=kiosk |
          openssl x509 -req -CA "$tls/client-ca.crt" -CAkey "$tls/client-ca.key" \
            -set_serial "0x$(openssl rand -hex 16)" -days 365 -extfile "$ext" -out "$d/client.crt.new"
        chgrp kiosk "$d/client.crt.new"; chmod 0640 "$d/client.crt.new"
        mv "$d/client.crt.new" "$d/client.crt"
        changed=1
      fi
      if [ -n "$changed" ]; then
        # 初回はまだ kiosk のサービスがない。
        systemctl try-restart k9s-kiosk.service 2>/dev/null || true
        echo changed
      fi

- name: Install the kiosk certificate service and timer
  become: true
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: '0644'
    content: "{{ item.content }}"
  loop:
    - name: k9s-kiosk-cert.service
      content: |
        [Unit]
        Description=Renew the k9s kiosk client certificate
        After=k3s.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/k9s-kiosk-cert
    - name: k9s-kiosk-cert.timer
      content: |
        [Unit]
        Description=Check the k9s kiosk client certificate daily

        [Timer]
        OnCalendar=daily
        RandomizedDelaySec=1h
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Issue or renew the kiosk client certificate
  become: true
  ansible.builtin.command: /usr/local/sbin/k9s-kiosk-cert
  register: kiosk_cert
  changed_when: "'changed' in kiosk_cert.stdout"

- name: Enable the kiosk certificate timer
  become: true
  ansible.builtin.systemd_service:
    name: k9s-kiosk-cert.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Write the kiosk kubeconfig
  become: true
  ansible.builtin.copy:
    dest: /etc/k9s-kiosk/kubeconfig
    owner: root
    group: kiosk
    mode: '0640'
    content: |
      apiVersion: v1
      kind: Config
      clusters:
        - name: k3s
          cluster:
            server: https://127.0.0.1:6443
            certificate-authority: /etc/k9s-kiosk/ca.crt
      users:
        - name: kiosk
          user:
            client-certificate: /etc/k9s-kiosk/client.crt
            client-key: /etc/k9s-kiosk/client.key
      contexts:
        - name: kiosk
          context:
            cluster: k3s
            user: kiosk
      current-context: kiosk
  # 旧方式の kubeconfig は token を含むため、差分を出さない。
  diff: false
  notify: Restart k9s kiosk
  ignore_errors: "{{ ansible_check_mode }}"

# マスクしないと、tty1 への切り替え時に logind が getty を起動しうる。
# 通常のログインは Ctrl+Alt+F2 で行う。
- name: Disable the login prompt on tty1
  become: true
  ansible.builtin.systemd_service:
    name: getty@tty1
    state: stopped
    masked: true

- name: Install the k9s kiosk service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/k9s-kiosk.service
    mode: '0644'
    content: |
      [Unit]
      Description=k9s on tty1
      After=systemd-user-sessions.service getty@tty1.service
      StartLimitIntervalSec=0

      [Service]
      User=kiosk
      Environment=TERM=linux
      Environment=KUBECONFIG=/etc/k9s-kiosk/kubeconfig
      WorkingDirectory=/var/lib/k9s-kiosk
      # k9s は --readonly でも :screendumps からエディターを起動しうる。
      UnsetEnvironment=EDITOR VISUAL KUBE_EDITOR K9S_EDITOR
      # API の準備ができるまで、理由を画面に出して待つ。
      ExecStartPre=/bin/sh -c 'until err=$$(kubectl get --raw=/readyz 2>&1 >/dev/null); do clear; echo "Waiting for k3s: $$err"; sleep 5; done'
      # k9s は起動時に metrics API がないと、CPU/MEM とグラフを出さないままになる。
      # metrics-server が壊れていても表示できるよう、OS の起動から 5 分を過ぎたら 30 秒で諦める。
      ExecStartPre=/bin/sh -c 'up() { cut -d. -f1 /proc/uptime; }; t=$$(up); until err=$$(kubectl --request-timeout=5s get --raw=/apis/metrics.k8s.io/v1beta1/nodes 2>&1 >/dev/null); do n=$$(up); [ $$n -ge 300 ] && [ $$((n-t)) -ge 30 ] && break; clear; echo "Waiting for metrics-server: $$err"; sleep 5; done'
      TimeoutStartSec=infinity
      ExecStart=/usr/bin/k9s --readonly -c pulse
      StandardInput=tty
      StandardOutput=tty
      StandardError=tty
      TTYPath=/dev/tty1
      TTYReset=yes
      TTYVHangup=yes
      NoNewPrivileges=yes
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
  notify: Restart k9s kiosk

- name: Enable the k9s kiosk service
  become: true
  ansible.builtin.systemd_service:
    name: k9s-kiosk
    enabled: true
    state: started
    daemon_reload: true
    # API を待つ間は起動中のままになるため、完了を待たない。
    no_block: true
  when: not ansible_check_mode
