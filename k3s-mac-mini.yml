# Mac mini 2018 (Ubuntu Server 26.04) を k3s サーバーにする。
# OS のインストール・IP 固定・SSH 公開鍵の登録が済んでいることが前提。
# 変数は inventory/ の group_vars と host_vars にある。
- name: Set up the k3s server
  hosts: k3s_server
  # 途中で失敗しても通知済みの handler を実行する。再実行では changed にならず、二度と通知されないため。
  force_handlers: true

  tasks:
    # never: 明示的に --tags で指定したときだけ実行する。
    - name: Include upgrade tasks
      ansible.builtin.import_tasks: tasks/k3s/upgrade.yml
      tags: [never, upgrade]
    - name: Include k3s server tasks
      ansible.builtin.import_tasks: tasks/k3s/server.yml
    - name: Include kubeconfig tasks
      ansible.builtin.import_tasks: tasks/k3s/kubeconfig.yml
    - name: Include console tasks
      ansible.builtin.import_tasks: tasks/k3s/console.yml
      tags: [never, console]
    - name: Include k9s kiosk tasks
      ansible.builtin.import_tasks: tasks/k3s/kiosk.yml
      tags: [never, kiosk]

  handlers:
    - name: Update GRUB
      become: true
      ansible.builtin.command: update-grub
      changed_when: true

    - name: Restart k9s kiosk
      become: true
      ansible.builtin.systemd_service:
        name: k9s-kiosk
        state: restarted
        daemon_reload: true
        no_block: true
      when: not ansible_check_mode
