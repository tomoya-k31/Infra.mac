# Mac mini 2018 (Ubuntu Server 26.04) を k3s サーバーにし、agent（M4 上の VM）を参加させる。
# OS のインストール・IP 固定・SSH 公開鍵の登録が済んでいることが前提。
# 変数は inventory/ の group_vars と host_vars にある。
- name: Set up the k3s server
  hosts: k3s_server
  # 途中で失敗しても通知済みの handler を実行する。再実行では changed にならず、二度と通知されないため。
  force_handlers: true
  # server で失敗したら agent に進まない（agent は server より新しい版にしない）。
  any_errors_fatal: true

  tasks:
    # never: 明示的に --tags で指定したときだけ実行する。
    # k3s の更新（k3s_version の変更）やノードの追加の前に取る。--tags all,backup なら、server.yml による更新より前に取る。
    - name: Include backup tasks
      ansible.builtin.import_tasks: tasks/k3s/backup.yml
      tags: [never, backup]
    - name: Include upgrade tasks
      ansible.builtin.import_tasks: tasks/k3s/upgrade.yml
      tags: [never, upgrade]
    # 画面とログの時刻を日本時間にする。動いている k3s は次の再起動まで UTC のまま。
    # timeZone を指定しない CronJob は、k3s の再起動後に日本時間で解釈される。
    - name: Set the time zone
      become: true
      community.general.timezone:
        name: Asia/Tokyo
    - name: Include k3s server tasks
      ansible.builtin.import_tasks: tasks/k3s/server.yml
    - name: Include kubeconfig tasks
      ansible.builtin.import_tasks: tasks/k3s/kubeconfig.yml
    - name: Include mDNS tasks
      ansible.builtin.import_tasks: tasks/k3s/mdns.yml
    - name: Include console tasks
      ansible.builtin.import_tasks: tasks/k3s/console.yml
      tags: [never, console]
    - name: Include k9s kiosk tasks
      ansible.builtin.import_tasks: tasks/k3s/kiosk.yml
      tags: [never, kiosk]

  handlers:
    - name: Update GRUB
      become: true
      ansible.builtin.command: update-grub
      changed_when: true

    # Restart avahi より前に置く（handler は定義順に動く）。
    - name: Reload systemd
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart avahi
      become: true
      ansible.builtin.systemd_service:
        name: avahi-daemon
        state: restarted
      # 初回の --check では avahi がまだ入っていない。
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Restart k9s kiosk
      become: true
      ansible.builtin.systemd_service:
        name: k9s-kiosk
        state: restarted
        daemon_reload: true
        no_block: true
      when: not ansible_check_mode

# server の後に agent を参加させる。--limit k3s_server で server だけを更新できる。
- name: Join the k3s agents
  hosts: k3s_agent
  # 更新や再起動は 1 台ずつ。
  serial: 1
  # --tags backup だけのときに VM へ接続しないよう、事実は下のタスクで集める。
  gather_facts: false

  tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags: [upgrade]
    - name: Include upgrade tasks
      ansible.builtin.import_tasks: tasks/k3s/upgrade.yml
      tags: [never, upgrade]
    # server と同じく日本時間にする。Lima は VM の作成時に macOS のタイムゾーンを写すだけなので固定する。
    - name: Set the time zone
      become: true
      community.general.timezone:
        name: Asia/Tokyo
    - name: Include k3s agent tasks
      ansible.builtin.import_tasks: tasks/k3s/agent.yml
